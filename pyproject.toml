[project]
name = "kinoscope"
version = "0.1.0"
description = "Hybrid GNN + ESM-2 model for kinase-inhibitor affinity prediction under leakage-free evaluation."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Axel Coiffard-Donaty" }]
keywords = ["drug-target-interaction", "graph-neural-network", "protein-language-model", "cheminformatics"]

dependencies = [
    "torch==2.4.1",
    "torch-geometric==2.6.1",
    "lightning==2.4.0",
    "transformers==4.44.2",
    "rdkit==2024.3.5",
    "numpy>=1.26,<2.0",
    "pandas==2.2.2",
    "polars==1.6.0",
    "pyarrow==17.0.0",
    "scikit-learn==1.5.1",
    "scipy==1.14.1",
    "lmdb==1.5.1",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "mlflow==2.16.0",
    "tqdm==4.66.5",
    "biopython==1.84",
    "requests==2.32.3",
]

[project.optional-dependencies]
serve = [
    "fastapi==0.114.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.0",
    "redis==5.0.8",
    "prometheus-fastapi-instrumentator==7.0.0",
    "onnxruntime==1.19.2",
]
dev = [
    "pytest==8.3.2",
    "pytest-cov==5.0.0",
    "pytest-xdist==3.6.1",
    "hypothesis==6.112.0",
    "ruff==0.6.4",
    "mypy==1.11.2",
    "pre-commit==3.8.0",
    "dvc[s3]==3.55.2",
    "mkdocs-material==9.5.34",
    "nbstripout==0.7.1",
]

[project.scripts]
kinoscope-train = "kinoscope.cli:train"
kinoscope-eval = "kinoscope.cli:evaluate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kinoscope"]

# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG", "PTH", "RUF", "NPY"]
ignore = ["E501", "B008", "N803", "N806"]  # N803/N806: X, H are standard ML notation

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "S101"]

# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false
plugins = []

[[tool.mypy.overrides]]
module = ["rdkit.*", "torch_geometric.*", "lmdb.*", "mlflow.*", "Bio.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --cov=kinoscope --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
markers = [
    "slow: tests requiring a GPU or full dataset (deselect with -m 'not slow')",
    "network: tests hitting external APIs (ChEMBL, KLIFS, UniProt)",
]

[tool.coverage.run]
branch = true
omit = ["src/kinoscope/serving/api.py", "*/__init__.py"]

default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]   # data belongs to DVC, never to git
        # `uv.lock` is 502 KB of resolved dependency metadata for 247 packages. The
        # 500 KB ceiling exists to keep *data* out of git; raising it for the whole
        # repository to accommodate one legitimate text file would weaken the guard
        # everywhere. The exception is named instead, so it stays visible.
        exclude: ^uv\.lock$
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # mypy runs in the project environment, not an isolated venv. The analysis needs
  # the full stack (torch, numpy, pandas-stubs, pydantic): the `mirrors-mypy` hook,
  # which can only install a few stub packages, reported 36 unresolved imports
  # instead of real errors. `language: system` guarantees that the hook and
  # `make typecheck` return the same verdict.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (project environment)
        entry: mypy
        language: system
        args: [src]
        pass_filenames: false
        files: ^src/
        types: [python]

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout   # notebooks are committed without outputs

  # Static analysis of the workflows themselves. `--offline` keeps the hook from
  # needing the network or a GitHub token locally; the CI job runs the same version
  # without that flag. Pinned to the exact release, like every other hook here.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.0
    hooks:
      - id: zizmor
        args: ["--offline"]

  # Without `--baseline` the hook has no record of what has already been reviewed:
  # every audited false positive comes back at the next commit. The baseline was
  # generated on a tree that gitleaks had already cleared over the full history.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]   # data belongs to DVC, never to git
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # mypy tourne dans l'environnement du projet, pas dans un venv isolé. L'analyse
  # a besoin du stack complet (torch, numpy, pandas-stubs, pydantic) : le miroir
  # `mirrors-mypy`, qui ne peut installer que quelques paquets de stubs, signalait
  # 36 imports introuvables au lieu des vraies erreurs. `language: system` garantit
  # que le hook et `make typecheck` rendent le même verdict.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (environnement du projet)
        entry: mypy
        language: system
        args: [src]
        pass_filenames: false
        files: ^src/
        types: [python]

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout   # notebooks are committed without outputs

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets

# Hydra entry point. Override from the CLI: python scripts/train.py split=cold_target
# `optional` on the groups whose files are written by a later phase: without it
# Hydra raises MissingConfigException at composition time and no entry point can
# start. Verified on Hydra 1.3.2. The intent stays declared here, and the group is
# picked up automatically as soon as its file exists.
defaults:
  - _self_
  - optional data: chembl_kinase      # written by PHASE 1
  - model: gine_esm2
  - split: scaffold
  - optional trainer: single_gpu      # written by PHASE 5

seed: 42
paths:
  # `PWD` is a POSIX shell variable: present under bash, absent under PowerShell.
  # Without a default, OmegaConf raises InterpolationResolutionError.
  root: ${oc.env:PWD,.}
  processed: ${paths.root}/data/processed
  artifacts: ${paths.root}/artifacts
  pockets_lmdb: ${paths.processed}/pockets.lmdb
  graphs_lmdb: ${paths.processed}/graphs.lmdb
  pairs: ${paths.processed}/pairs.parquet

# Single source of truth for any published figure: the JSON files declared as
# `metrics` in dvc.yaml, which are versioned alongside the code that produced them.
# MLflow is a convenience UI over training runs and is authoritative for nothing.
# Two tracking systems are tolerable; two answers to "what is the cold_target RMSE"
# are not.
logging:
  backend: mlflow
  tracking_uri: http://localhost:5000
  experiment_name: kinoscope
  log_every_n_steps: 25

# Block style is mandatory here: in flow style the braces of `${now:...}` are read
# as a nested mapping and the file fails to parse — OmegaConf itself included.
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false

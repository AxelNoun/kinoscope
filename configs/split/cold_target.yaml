name: cold_target
strategy: cold_target
by: manning_group      # 'uniprot' for a more permissive regime
fractions: [0.8, 0.1, 0.1]
seed: 42

# Leakage-audit failure thresholds. CI rejects a run that exceeds them.
audit:
  max_shared_inchikeys: 0
  max_shared_uniprots: 0
  max_shared_scaffolds: 0
  max_tanimoto_train_test: 0.85

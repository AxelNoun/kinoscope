services:
  api:
    build: { context: .., dockerfile: docker/Dockerfile, target: serve }
    ports: ["8000:8000"]
    environment:
      KINOSCOPE_CHECKPOINT: /artifacts/model.ckpt
      KINOSCOPE_POCKETS: /artifacts/pockets.lmdb
      KINOSCOPE_CONFORMAL: /artifacts/conformal.json
      REDIS_URL: redis://redis:6379/0
    volumes: ["../artifacts:/artifacts:ro"]
    depends_on: { redis: { condition: service_healthy } }
    deploy: { resources: { limits: { memory: 4G } } }

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, retries: 5 }

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.0
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlruns/mlflow.db --default-artifact-root /mlruns/artifacts
    ports: ["5000:5000"]
    volumes: ["../mlruns:/mlruns"]

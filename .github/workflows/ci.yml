name: CI

on:
  push: { branches: [main, develop] }
  pull_request: { branches: [main] }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Aucun job de ce workflow n'écrit dans le dépôt : la lecture du contenu suffit.
# Sans ce bloc, le GITHUB_TOKEN hérite des permissions par défaut de l'organisation,
# qui peuvent inclure l'écriture. Le déclarer au niveau workflow le fige pour tous
# les jobs, y compris ceux ajoutés plus tard.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

# Les actions sont épinglées par SHA de commit, pas par tag : un tag est mutable et
# peut être redirigé vers un commit malveillant sans changer la ligne `uses:`.
# Le commentaire donne la version lisible correspondante.
jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - run: pip install ruff==0.6.4
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts

  typecheck:
    name: Typecheck (mypy strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[serve,dev]" --extra-index-url https://download.pytorch.org/whl/cpu
      - run: mypy src

  test:
    name: Tests unitaires et d'intégration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11", cache: pip }
      - name: Install (CPU wheels only)
        run: |
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[serve,dev]"
      - name: Run test suite
        # Le profil `ci` porte Hypothesis à 200 exemples : en local le défaut
        # `dev` (25 exemples) rend la main vite, la CI cherche réellement des
        # contre-exemples.
        env: { HYPOTHESIS_PROFILE: ci }
        run: pytest -n auto -m "not slow and not network" --cov=kinoscope --cov-report=xml
      - uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with: { files: coverage.xml, fail_ci_if_error: false }

  # Garde-fou scientifique : la CI échoue si un split laisse fuiter des données.
  leakage-gate:
    name: Garde-fou de fuite de données
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11", cache: pip }
      - run: |
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - run: pytest tests/unit/test_splits.py tests/unit/test_splits_properties.py -v --no-cov

  # Analyse statique des workflows eux-mêmes. `pipx` est préinstallé sur les runners
  # GitHub : lancer zizmor par ce biais évite d'ajouter une action tierce — donc une
  # dépendance de plus dans la chaîne d'approvisionnement — au workflow qu'il audite.
  workflows:
    name: Audit des workflows (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - run: pipx run zizmor==1.30.0 --persona=pedantic --format plain .github/

name: CI

on:
  push: { branches: [main, develop] }
  pull_request: { branches: [main] }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No job in this workflow writes to the repository, so read access is enough.
# Without this block the GITHUB_TOKEN inherits the organisation defaults, which
# may include write. Declaring it at workflow level pins it for every job,
# including any added later.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

# Actions are pinned by commit SHA rather than tag: a tag is mutable and can be
# repointed at a malicious commit without the `uses:` line changing. The trailing
# comment gives the human-readable version.
jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - run: pip install ruff==0.6.4
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts

  typecheck:
    name: Typecheck (mypy strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[serve,dev]" --extra-index-url https://download.pytorch.org/whl/cpu
      - run: mypy src

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11", cache: pip }
      - name: Install (CPU wheels only)
        run: |
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[serve,dev]"
      - name: Run test suite
        # The `ci` profile raises Hypothesis to 200 examples. Locally the `dev`
        # default (25) returns quickly; CI actually searches for counterexamples.
        env: { HYPOTHESIS_PROFILE: ci }
        run: pytest -n auto -m "not slow and not network" --cov=kinoscope --cov-report=xml
      - uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with: { files: coverage.xml, fail_ci_if_error: false }

  # Scientific gate: CI fails if a split leaks data between train and test.
  leakage-gate:
    name: Data-leakage gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11", cache: pip }
      - run: |
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - run: pytest tests/unit/test_splits.py tests/unit/test_splits_properties.py -v --no-cov

  # Static analysis of the workflows themselves. `pipx` is preinstalled on GitHub
  # runners, so invoking zizmor this way avoids adding a third-party action — one
  # more supply-chain dependency — to the very workflow it audits.
  workflows:
    name: Workflow audit (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - run: pipx run zizmor==1.30.0 --persona=pedantic --format plain .github/

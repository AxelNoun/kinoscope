name: CI

on:
  push: { branches: [main, develop] }
  pull_request: { branches: [main] }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ruff==0.6.4
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[serve,dev]" --extra-index-url https://download.pytorch.org/whl/cpu
      - run: mypy src

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - name: Install (CPU wheels only)
        run: |
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[serve,dev]"
      - name: Run test suite
        run: pytest -n auto -m "not slow and not network" --cov=kinoscope --cov-report=xml
      - uses: codecov/codecov-action@v4
        with: { files: coverage.xml, fail_ci_if_error: false }

  # Garde-fou scientifique : la CI échoue si un split laisse fuiter des données.
  leakage-gate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: |
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - run: pytest tests/unit/test_splits.py -v --no-cov
